version: "3.9"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/gateway_db
      DISCOVERY_URL: http://discovery-lb:8010
      RESILIENCE_URL: http://resilience:8020
      JWT_SECRET: changeme-please-update-in-production
      JWT_SECRET_KEY: changeme-please-update-in-production
      RATE_LIMIT_MAX_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    depends_on:
      - db
      - discovery-lb
      - resilience
      - service-a
      - service-a-2
      - service-b
      - service-c
    networks:
      - app-network

  discovery-lb:
    build: ./discovery-lb
    ports:
      - "8010:8010"
    networks:
      - app-network

  resilience:
    build: ./resilience
    ports:
      - "8020:8020"
    environment:
      DISCOVERY_URL: http://discovery-lb:8010
    depends_on:
      - discovery-lb
    networks:
      - app-network

  security:
    build:
      context: .
      dockerfile: security/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/gateway_db
      JWT_SECRET: changeme-please-update-in-production
      JWT_SECRET_KEY: changeme-please-update-in-production
    depends_on:
      - db
    networks:
      - app-network

  service-a:
    build: ./services/service_a
    ports:
      - "8001:8001"
    environment:
      DISCOVERY_URL: http://discovery-lb:8010
      SERVICE_HOST: service-a
      SERVICE_PORT: "8001"
    networks:
      - app-network

  service-a-2:
    build: ./services/service_a
    ports:
      - "8011:8001"
    environment:
      DISCOVERY_URL: http://discovery-lb:8010
      SERVICE_HOST: service-a-2
      SERVICE_PORT: "8001"
    networks:
      - app-network

  service-b:
    build: ./services/service_b
    ports:
      - "8002:8002"
    environment:
      DISCOVERY_URL: http://discovery-lb:8010
    networks:
      - app-network

  service-c:
    build: ./services/service_c
    ports:
      - "8003:8003"
    environment:
      DISCOVERY_URL: http://discovery-lb:8010
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gateway_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shared/migrations/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
